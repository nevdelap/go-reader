[package]
name = "jmdict-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
ultra = []
full = []

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
postcard = { version = "1", features = ["use-std"] }

[profile.release]
opt-level = "z"
lto = true
